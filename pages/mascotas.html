<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis Mascotas | PetLab</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <script src="https://cdn.lordicon.com/lordicon.js"></script>

  <link rel="stylesheet" href="/styles/navbar.css" />
  <link rel="stylesheet" href="/styles/footer.css" />
  <link rel="stylesheet" href="/styles/mascotas.css" />
</head>
<body>
  <div id="container-navbar"></div>

  <main>
    <section class="container py-4">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
        <div>
          <h2 class="fw-bold mb-1">Mis Mascotas</h2>
          <p class="text-muted mb-0">Consulta y administra la información de tus mascotas.</p>
        </div>
        <button class="btn btn-mascota-primary" data-bs-toggle="modal" data-bs-target="#modalMascota" onclick="abrirModalNueva()">
          <i class="bi bi-plus-lg"></i> Añadir mascota
        </button>
      </div>

      <!-- Grid de mascotas -->
      <div class="row g-3" id="mascotasContainer"></div>

      <!-- Estado vacío -->
      <div class="text-center py-5 d-none" id="mascotasVacio">
        <i class="bi bi-heart display-4 text-muted"></i>
        <p class="mt-3 mb-2 fw-semibold">Aún no tienes mascotas registradas.</p>
        <button class="btn btn-mascota-primary" data-bs-toggle="modal" data-bs-target="#modalMascota" onclick="abrirModalNueva()">
          Registrar mi primera mascota
        </button>
      </div>
    </section>
  </main>

  <div id="container-footer" class="container-footer"></div>

  <!-- Modal registrar / editar mascota -->
  <div class="modal fade" id="modalMascota" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalMascotaTitulo">Añadir mascota</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <form id="formMascota">
            <input type="hidden" id="mascotaId">
            <div class="mb-3">
              <div class="mb-3 text-center">
  <div class="mascota-foto-preview" id="mascotaFotoPreview">
    <i class="bi bi-camera"></i>
  </div>
  <label class="btn btn-sm btn-outline-secondary mt-2 mb-0">
    Subir foto
    <input type="file" id="mascotaFoto" accept="image/*" hidden>
  </label>
</div>
              <label class="form-label">Nombre *</label>
              <input type="text" class="form-control" id="mascotaNombre" placeholder="Ej. Max" required>
            </div>
            <div class="row">
              <div class="col-6 mb-3">
                <label class="form-label">Especie *</label>
                <select class="form-select" id="mascotaEspecie" required>
                  <option value="">Selecciona...</option>
                  <option>Perro</option>
                  <option>Gato</option>
                  <option>Ave</option>
                  <option>Conejo</option>
                  <option>Otro</option>
                </select>
              </div>
              <div class="col-6 mb-3">
                <label class="form-label">Raza</label>
                <input type="text" class="form-control" id="mascotaRaza" placeholder="Ej. Labrador">
              </div>
            </div>
            <div class="row">
              <div class="col-6 mb-3">
                <label class="form-label">Edad (años)</label>
                <input type="number" min="0" class="form-control" id="mascotaEdad" placeholder="0">
              </div>
              <div class="col-6 mb-3">
                <label class="form-label">Peso (kg)</label>
                <input type="number" min="0" step="0.1" class="form-control" id="mascotaPeso" placeholder="0">
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Notas (alergias, condiciones, etc.)</label>
              <textarea class="form-control" id="mascotaNotas" rows="2"></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-mascota-primary" id="btnGuardarMascota">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
  <script src="/scripts/scripst.js"></script>
  <script src="/scripts/footer.js"></script>
  <script src="/scripts/mascotas.js"></script>
</body>
</html>
