<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de Administración | PetLab</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <script src="https://cdn.lordicon.com/lordicon.js"></script>

  <link rel="stylesheet" href="/styles/navbar.css" />
  <link rel="stylesheet" href="/styles/footer.css" />
  <link rel="stylesheet" href="/styles/adminPyS.css" />
</head>
<body>
  <div id="container-navbar"></div>

  <main>
    <section class="container py-4">
      <h2 class="fw-bold mb-1">Panel de Administración</h2>
      <p class="text-muted mb-4">Gestiona los servicios y las citas de PetLab.</p>

      <ul class="nav nav-pills mb-4" id="adminTabs">
        <li class="nav-item">
          <button class="nav-link active" data-tab="tabServicios">Servicios</button>
        </li>
        <li class="nav-item">
          <button class="nav-link" data-tab="tabCitas">Citas</button>
        </li>
      </ul>

      <!-- Servicios -->
      <div id="tabServicios" class="admin-tab">
        <div class="d-flex justify-content-end mb-3">
          <button class="btn btn-admin-primary" data-bs-toggle="modal" data-bs-target="#modalItem" onclick="abrirModalNuevoItem()">
            <i class="bi bi-plus-lg"></i> Añadir servicio
          </button>
        </div>

        <div class="table-responsive admin-panel">
          <table class="table align-middle mb-0">
            <thead>
              <tr>
                <th>Imagen</th><th>Nombre</th><th>Precio</th><th>Duración</th><th></th>
              </tr>
            </thead>
            <tbody id="itemsTableBody">
              <tr><td colspan="5" class="text-center text-muted py-4">Cargando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Citas -->
      <div id="tabCitas" class="admin-tab d-none">
        <div class="table-responsive admin-panel">
          <table class="table align-middle mb-0">
            <thead>
              <tr>
                <th>Mascota</th><th>Veterinario</th><th>Servicio</th><th>Fecha</th><th>Hora</th><th>Estado</th><th></th>
              </tr>
            </thead>
            <tbody id="citasTableBody">
              <tr><td colspan="7" class="text-center text-muted py-4">No hay citas registradas.</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <div id="container-footer" class="container-footer"></div>

  <!-- Modal crear/editar servicio -->
  <div class="modal fade" id="modalItem" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalItemTitulo">Añadir servicio</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="formItem">
            <input type="hidden" id="itemId">
            <div class="mb-3">
              <label class="form-label">Nombre *</label>
              <input type="text" class="form-control" id="itemNombre" required>
            </div>
            <div class="row">
              <div class="col-6 mb-3">
                <label class="form-label">Precio *</label>
                <input type="number" min="0" class="form-control" id="itemPrecio" required>
              </div>
              <div class="col-6 mb-3">
                <label class="form-label">Duración (min)</label>
                <input type="number" min="0" class="form-control" id="itemDuracion" placeholder="Ej. 30">
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">URL de la imagen</label>
              <input type="text" class="form-control" id="itemImagen" placeholder="https://...">
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-admin-primary" id="btnGuardarItem">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
  <script src="/scripts/scripst.js"></script>
  <script src="/scripts/footer.js"></script>
  <script src="/scripts/adminPyS.js"></script>
</body>
</html>
