<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detalle | PetLab</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.lordicon.com/lordicon.js"></script>

  <link rel="stylesheet" href="/styles/navbar.css" />
  <link rel="stylesheet" href="/styles/footer.css" />
  <link rel="stylesheet" href="/styles/detail.css" />
</head>
<body>
  <div id="container-navbar"></div>

  <main>
    <section class="container py-4">
      <a href="/index.html" class="volver-link"><i class="bi bi-arrow-left"></i> Volver</a>

      <div class="detail-wrap mt-3" id="detailWrap">
        <p class="text-muted">Cargando...</p>
      </div>
    </section>
  </main>

  <div id="container-footer" class="container-footer"></div>

  <!-- Modal reservar (solo se usa si el item es un servicio) -->
  <div class="modal fade" id="modalReserva" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Reservar Servicio</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <label>Mascota:</label>
          <select id="reservaMascota" class="form-select mb-3">
            <option value="">Selecciona una mascota (opcional)</option>
          </select>

          <label>Veterinario:</label>
          <select id="reservaVeterinario" class="form-select mb-3">
            <option value="">Sin preferencia</option>
            <option>Dr. Diego Ramírez — Medicina general</option>
            <option>Dra. Valentina Cruz — Cirugía</option>
            <option>Dr. Mauricio Peña — Dermatología</option>
            <option>Dra. Natalia Arias — Odontología</option>
          </select>

          <label>Selecciona una fecha:</label>
          <input type="date" id="inputFecha" class="form-control mb-3" min="" />

          <label>Selecciona una hora:</label>
          <div id="horasContainer" class="d-flex flex-wrap gap-2 mt-2 mb-3"></div>
        </div>
        <div class="modal-footer">
          <button id="confirmarReserva" class="btn btn-primary" disabled>Confirmar reserva</button>
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="modalReservaConfirmada" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content text-center p-4">
        <i class="bi bi-check-circle-fill text-success" style="font-size:3.5rem;"></i>
        <h4 class="fw-bold mt-3">¡Cita confirmada!</h4>
        <p class="text-muted mb-1" id="reservaResumen"></p>
        <button class="btn btn-primary mt-3" data-bs-dismiss="modal">Entendido</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
  <script src="/scripts/scripst.js"></script>
  <script src="/scripts/footer.js"></script>
  <script src="/scripts/cart.js"></script>
  <script src="/scripts/reserva.js"></script>
  <script src="/scripts/detail.js"></script>
</body>
</html>
