<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mis Citas | PetLab</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.lordicon.com/lordicon.js"></script>

  <link rel="stylesheet" href="/styles/navbar.css" />
  <link rel="stylesheet" href="/styles/footer.css" />
  <link rel="stylesheet" href="/styles/citas.css" />
</head>
<body>
  <div id="container-navbar"></div>

  <main>
    <section class="container py-4">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
        <div>
          <h2 class="fw-bold mb-1">Mis Citas</h2>
          <p class="text-muted mb-0">Agenda, revisa y da seguimiento a las citas de tus mascotas.</p>
        </div>
        <button class="btn btn-cita-primary" data-bs-toggle="modal" data-bs-target="#modalCita" onclick="abrirModalNuevaCita()">
          <i class="bi bi-calendar-plus"></i> Agendar cita
        </button>
      </div>
      <div class="modal fade" id="modalCitaConfirmada" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content text-center p-4">
      <i class="bi bi-check-circle-fill text-success" style="font-size:3.5rem;"></i>
      <h4 class="fw-bold mt-3">¡Cita confirmada!</h4>
      <p class="text-muted mb-1" id="confirmacionResumen"></p>
      <button class="btn btn-cita-primary mt-3" data-bs-dismiss="modal">Entendido</button>
    </div>
  </div>
</div>

      <div class="row g-3" id="citasContainer"></div>

      <div class="text-center py-5 d-none" id="citasVacio">
        <i class="bi bi-calendar-heart display-4 text-muted"></i>
        <p class="mt-3 mb-2 fw-semibold">No tienes citas agendadas.</p>
        <button class="btn btn-cita-primary" data-bs-toggle="modal" data-bs-target="#modalCita" onclick="abrirModalNuevaCita()">
          Agendar mi primera cita
        </button>
      </div>
    </section>
  </main>

  <div id="container-footer" class="container-footer"></div>

  <!-- Modal agendar / editar cita -->
  <div class="modal fade" id="modalCita" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalCitaTitulo">Agendar cita</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <form id="formCita">
            <input type="hidden" id="citaId">
            <div class="mb-3">
              <label class="form-label">Mascota *</label>
              <select class="form-select" id="citaMascota" required></select>
              <small class="text-muted" id="avisoSinMascotas" style="display:none;">
                No tienes mascotas registradas. <a href="/pages/mascotas.html">Añade una aquí</a>.
              </small>
            </div>
            <div class="mb-3">
              <label class="form-label">Veterinario *</label>
              <select class="form-select" id="citaVeterinario" required>
                <option value="">Selecciona...</option>
                <option>Dr. Diego Ramírez — Medicina general</option>
                <option>Dra. Valentina Cruz — Cirugía</option>
                <option>Dr. Mauricio Peña — Dermatología</option>
                <option>Dra. Natalia Arias — Odontología</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Servicio</label>
              <select class="form-select" id="citaServicio">
                <option value="">Cargando servicios...</option>
              </select>
            </div>
            <div class="row">
              <div class="col-6 mb-3">
                <label class="form-label">Fecha *</label>
                <input type="date" class="form-control" id="citaFecha" required>
              </div>
              <div class="col-6 mb-3">
                <label class="form-label">Hora *</label>
                <input type="time" class="form-control" id="citaHora" required>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Estado</label>
              <select class="form-select" id="citaEstado">
                <option>Pendiente</option>
                <option>Confirmada</option>
                <option>Cancelada</option>
              </select>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-cita-primary" id="btnGuardarCita">Guardar cita</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
  <script src="/scripts/scripst.js"></script>
  <script src="/scripts/footer.js"></script>
  <script src="/scripts/citas.js"></script>
</body>
</html>
